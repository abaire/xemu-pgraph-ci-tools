name: CI & Package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  HATCH_VERSION: "1.17.0"
  RUFF_VERSION: "0.15.17"
  MYPY_VERSION: "1.15.0"
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Hatch
        run: |
          python -m pip install --upgrade pip
          pip install hatch==${{ env.HATCH_VERSION }}

      - name: Run code formatting & lint checks
        run: hatch fmt --check

      - name: Run type checks
        run: hatch run types:check

      - name: Run test suite
        run: hatch test

  build:
    name: Build & Package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Hatch
        run: |
          python -m pip install --upgrade pip
          pip install hatch==${{ env.HATCH_VERSION }}

      - name: Build distribution packages
        run: hatch build

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
